name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke-test:
    name: Import project and run smoke test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --path game --import

      - name: Run smoke-test scene
        run: timeout 30 godot --headless --path game --quit-after 2
